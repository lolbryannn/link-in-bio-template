  <style>
    /* ---------- Themes (pilih di PAGE.theme / choose in PAGE.theme) ---------- */
    :root, [data-theme="midnight"] {
      --bg: #0b0c10; --bg-2: #14161d; --card: #171a22; --card-hover: #1e222c;
      --line: #262a35; --text: #f1f3f7; --muted: #9aa1b1; --accent: #8b7bff; --accent-ink: #fff;

      --line: #2a3320; --text: #f2ffe0; --muted: #9bb07d; --accent: #b8ff3c; --accent-ink: #0b0e05;
      --glow: rgba(184, 255, 60, .35);

    [data-theme="peach"] {
      --bg: #ffe9df; --bg-2: #ffd9c9; --card: #fff6f1; --card-hover: #ffffff;
      --line: #f6c9b4; --text: #3a2119; --muted: #8a5b4b; --accent: #ff6f61; --accent-ink: #fff;
      --glow: rgba(255, 111, 97, .3);

    [data-theme="ocean"] {

      --line: #1a4560; --text: #e6f6ff; --muted: #8fb7cc; --accent: #2ed3c6; --accent-ink: #032024;
      --glow: rgba(46, 211, 198, .3);

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      background: radial-gradient(120% 70% at 50% -10%, var(--bg-2) 0%, var(--bg) 60%) fixed, var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex; justify-content: center;
      padding: max(28px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));

    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 12px; }
    .page { width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; }

    /* top bar */
    .top { width: 100%; display: flex; justify-content: flex-end; margin-bottom: 8px; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
      background: var(--card); border: 1px solid var(--line);
    }
    .icon-btn:hover { background: var(--card-hover); }
    .icon-btn svg { width: 18px; height: 18px; }

    /* profile */
    .avatar {
      width: 104px; height: 104px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
      display: grid; place-items: center; font-size: 38px; font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--bg-2));
      color: var(--accent-ink); border: 3px solid var(--card);
      box-shadow: 0 0 0 1px var(--line), 0 12px 40px var(--glow);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    h1 { margin: 16px 0 4px; font-size: 22px; letter-spacing: -.01em; text-align: center; display: flex; align-items: center; gap: 6px; }
    h1 .verified { width: 18px; height: 18px; color: var(--accent); }
    .handle { color: var(--muted); font-size: 14px; }
    .bio { color: var(--muted); text-align: center; margin: 10px 0 0; max-width: 36ch; white-space: pre-line; }
    .status {
      margin-top: 12px; display: inline-flex; align-items: center; gap: 8px;
      font-size: 13px; padding: 5px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line);
    }
    .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #2ecc71; box-shadow: 0 0 8px #2ecc71; }

    /* socials */
    .socials { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 18px 0 6px; padding: 0; list-style: none; }
    .socials a {
      width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
      background: var(--card); border: 1px solid var(--line); transition: transform .15s, background .15s;

    .socials a:hover { transform: translateY(-2px); background: var(--card-hover); }
    .socials svg { width: 20px; height: 20px; }

    /* links */
    .links { width: 100%; display: flex; flex-direction: column; gap: 12px; margin: 18px 0 0; padding: 0; list-style: none; }
    .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 14px 4px 0; text-align: center; }
    .link {
      position: relative; display: flex; align-items: center; gap: 14px; min-height: 62px;
      padding: 10px 16px 10px 10px; border-radius: 18px;
      background: var(--card); border: 1px solid var(--line);
      transition: transform .15s, background .15s, border-color .15s;
    }
    .link:hover { transform: translateY(-2px); background: var(--card-hover); border-color: var(--accent); }
    .link:active { transform: scale(.98); }
    .link .ico {
      width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0; display: grid; place-items: center;
      background: var(--bg-2); color: var(--text);
    }
    .link .ico svg { width: 21px; height: 21px; }
    .link .ico img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
    .link .txt { flex: 1; min-width: 0; }
    .link .t { display: block; font-weight: 600; line-height: 1.3; }
    .link .s { display: block; font-size: 13px; color: var(--muted); line-height: 1.35; margin-top: 1px; }
    .link .arr { color: var(--muted); flex-shrink: 0; font-size: 18px; }
    .link.hl { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 10px 30px var(--glow); }
    .link.hl .s, .link.hl .arr { color: inherit; opacity: .8; }
    .link.hl .ico { background: rgba(255,255,255,.18); color: inherit; }
    .link .badge {
      position: absolute; top: -9px; right: 14px; font-size: 11px; font-weight: 700; letter-spacing: .04em;
      padding: 2px 8px; border-radius: 999px; background: var(--text); color: var(--bg);
    }

    footer { margin-top: 34px; font-size: 12px; color: var(--muted); text-align: center; }
    footer a { text-decoration: underline; text-underline-offset: 2px; }

    /* toast */
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px); opacity: 0;
      background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px;
      transition: .25s; pointer-events: none; z-index: 10;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* demo theme switcher (only shows with ?demo in the URL) */
    .demo {
      position: fixed; left: 50%; top: 10px; transform: translateX(-50%); z-index: 20;
      display: flex; gap: 6px; padding: 6px; border-radius: 999px;

    .demo button { border: 0; padding: 6px 10px; border-radius: 999px; background: transparent; color: #fff; font-size: 12px; }
    .demo button[aria-pressed="true"] { background: #fff; color: #000; font-weight: 600; }
    body.has-demo { padding-top: 64px; }

    /* entrance animation */
    .rise { opacity: 0; transform: translateY(10px); animation: rise .5s ease forwards; }
    @keyframes rise { to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
      .rise { opacity: 1; transform: none; }
    }
  </style>
</head>

    const NAMES = { instagram: "Instagram", tiktok: "TikTok", youtube: "YouTube", whatsapp: "WhatsApp", x: "X", facebook: "Facebook", github: "GitHub", email: "Email", music: "Music", shop: "Shop", link: "Link" };

    function detect(url) {
      const u = String(url).toLowerCase();
      if (u.startsWith("mailto:")) return "email";
      if (/instagram\.com/.test(u)) return "instagram";
      if (/tiktok\.com/.test(u)) return "tiktok";
      if (/youtube\.com|youtu\.be/.test(u)) return "youtube";
      if (/wa\.me|whatsapp\.com/.test(u)) return "whatsapp";
      if (/(^|\/\/|\.)(x|twitter)\.com/.test(u)) return "x";
      if (/facebook\.com|fb\.com/.test(u)) return "facebook";
      if (/github\.com/.test(u)) return "github";
      if (/spotify\.com|music\.apple|soundcloud/.test(u)) return "music";
      if (/shopee|tokopedia|lazada|tiktokshop|bukalapak|blibli/.test(u)) return "shop";
      if (/maps\.google|goo\.gl\/maps|maps\.app/.test(u)) return "map";
      return "link";
    }
    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function safe(url) {
      const s = String(url || "").trim();
      return /^(https?:|mailto:|tel:|#)/i.test(s) || /^[\w./-]+$/.test(s) ? s : "#";
    }
    function external(url) { return /^https?:/i.test(url); }
    function initials(name) {
      return String(name || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();
    }

    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg; t.classList.add("show");
      clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1800);
    }

    function render(theme) {
      document.documentElement.dataset.theme = theme;
      if (PAGE.accent) document.documentElement.style.setProperty("--accent", PAGE.accent);
      document.title = PAGE.name + (PAGE.handle ? " (" + PAGE.handle + ")" : "");
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();

      let d = 0;
      const delay = () => `style="animation-delay:${(d++ * 0.05).toFixed(2)}s"`;

      const avatar = PAGE.avatar
        ? `<img src="${esc(safe(PAGE.avatar))}" alt="${esc(PAGE.name)}">`
        : esc(initials(PAGE.name));

      const socials = (PAGE.socials || []).map(u => {
        const k = detect(u);
        return `<li><a href="${esc(safe(u))}" ${external(u) ? 'target="_blank" rel="noopener"' : ""} aria-label="${esc(NAMES[k] || k)}">${ICONS[k] || ICONS.link}</a></li>`;
      }).join("");

      const links = (PAGE.links || []).map(l => {
        const k = l.icon && ICONS[l.icon] ? l.icon : detect(l.url);
        const ico = l.image ? `<img src="${esc(safe(l.image))}" alt="">` : (ICONS[k] || ICONS.link);
        const section = l.section ? `<li class="section-title rise" ${delay()}>${esc(l.section)}</li>` : "";
        return `${section}<li class="rise" ${delay()}>
          <a class="link${l.highlight ? " hl" : ""}" href="${esc(safe(l.url))}" ${external(l.url) ? 'target="_blank" rel="noopener"' : ""}>
            ${l.badge ? `<span class="badge">${esc(l.badge)}</span>` : ""}
            <span class="ico" aria-hidden="true">${ico}</span>
            <span class="txt"><span class="t">${esc(l.title)}</span>${l.sub ? `<span class="s">${esc(l.sub)}</span>` : ""}</span>
            <span class="arr" aria-hidden="true">›</span>
          </a></li>`;
      }).join("");

      document.getElementById("page").innerHTML = `
        <div class="top"><button class="icon-btn" type="button" id="share" aria-label="Share">${ICONS.share}</button></div>
        <div class="avatar rise" ${delay()}>${avatar}</div>
        <h1 class="rise" ${delay()}>${esc(PAGE.name)}${PAGE.verified ? `<span class="verified" aria-label="verified">${ICONS.check}</span>` : ""}</h1>
        ${PAGE.handle ? `<div class="handle rise" ${delay()}>${esc(PAGE.handle)}</div>` : ""}
        ${PAGE.bio ? `<p class="bio rise" ${delay()}>${esc(PAGE.bio)}</p>` : ""}
        ${PAGE.status ? `<div class="status rise" ${delay()}>${esc(PAGE.status)}</div>` : ""}
        ${socials ? `<ul class="socials rise" ${delay()}>${socials}</ul>` : ""}
        <ul class="links">${links}</ul>
        <footer>
          ${PAGE.footer ? `<div>${esc(PAGE.footer)}</div>` : ""}
          ${PAGE.credit ? `<div>template by <a href="https://www.instagram.com/lolbryannn/" target="_blank" rel="noopener">@lolbryannn</a></div>` : ""}
        </footer>`;

      document.getElementById("share").addEventListener("click", async () => {
        const data = { title: document.title, url: location.href };
        if (navigator.share) { try { await navigator.share(data); return; } catch (e) { if (e && e.name === "AbortError") return; } }
        try { await navigator.clipboard.writeText(location.href); toast("Link disalin / Link copied ✓"); }
        catch (e) { toast(location.href); }
      });
    }

    // Demo mode: add ?demo to the URL to show a theme switcher.
    const params = new URLSearchParams(location.search);
    const themes = ["midnight", "paper", "neon", "peach", "ocean"];
    let theme = themes.includes(params.get("theme")) ? params.get("theme") : (themes.includes(PAGE.theme) ? PAGE.theme : "midnight");
    render(theme);

    if (params.has("demo")) {
      document.body.classList.add("has-demo");
      const bar = document.createElement("div");
      bar.className = "demo"; bar.setAttribute("role", "group"); bar.setAttribute("aria-label", "Theme");
      bar.innerHTML = themes.map(t => `<button type="button" data-t="${t}" aria-pressed="${t === theme}">${t}</button>`).join("");
      bar.addEventListener("click", e => {
        const b = e.target.closest("button"); if (!b) return;
        theme = b.dataset.t;
        bar.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.t === theme)));
        render(theme);
      });
      document.body.appendChild(bar);
    }
  })();
  </script>
</body>
</html>
